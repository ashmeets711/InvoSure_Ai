<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InvoSureAI | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg border-0 p-4" style="width: 100%; max-width: 400px; border-radius: 20px;">
            <div class="text-center mb-4">
                <i class="fas fa-robot fa-3x text-primary mb-2"></i>
                <h3 class="fw-bold">Welcome Back</h3>
                <p class="text-muted">Secure Login for MSME Partners</p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Business Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0" placeholder="name@company.com" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0"><i class="fas fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">Login to Dashboard</button>
            </form>
            <div class="text-center mt-4">
                <p class="small text-muted">New partner? <a href="signup.html" class="text-primary fw-bold text-decoration-none">Create Account</a></p>
            </div>
        </div>
    </div>
</body>
</html>
