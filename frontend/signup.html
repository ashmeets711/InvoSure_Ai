<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>InvoSureAI | Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow-lg border-0 p-4" style="width: 100%; max-width: 450px; border-radius: 20px;">
            <div class="text-center mb-4">
                <h3 class="fw-bold">Register Business</h3>
                <p class="text-muted">Start your AI-driven compliance journey</p>
            </div>
            <form id="signupForm">
                <div class="row">
                    <div class="col-md-12 mb-3">
                        <label class="form-label small fw-bold">Business Name</label>
                        <input type="text" class="form-control" placeholder="e.g. Sharma Electronics" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Business GSTIN</label>
                    <input type="text" class="form-control text-uppercase" placeholder="29AAAAA0000A1Z5" maxlength="15" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" class="form-control" placeholder="admin@business.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Password</label>
                    <input type="password" class="form-control" placeholder="Create strong password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Register & Continue</button>
            </form>
            <div class="text-center mt-3">
                <p class="small text-muted">Already registered? <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
            </div>
        </div>
    </div>
</body>
</html>
